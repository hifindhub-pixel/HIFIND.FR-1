name: Benchmark Ranking
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/benchmarks/ranking.js', '.github/workflows/benchmark-ranking.yml']
permissions:
  contents: read
concurrency:
  group: benchmark-ranking
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Compare ranking queries in a read-only snapshot
        env:
          NEON_URL: ${{ secrets.NEON_URL }}
        run: node scripts/benchmarks/ranking.js
