name: Lister les marchands acceptés

on:
  workflow_dispatch:  # Bouton "Run workflow" dans l'onglet Actions de GitHub -- aucun terminal necessaire

jobs:
  list-merchants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Liste les marchands Awin + CJ
        env:
          AWIN_API_KEY: ${{ secrets.AWIN_API_KEY }}
          CJ_TOKEN: ${{ secrets.CJ_TOKEN }}
          CJ_PUBLISHER_ID: ${{ secrets.CJ_PUBLISHER_ID }}
        run: node scripts/list-merchants.js
