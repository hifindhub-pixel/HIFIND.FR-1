name: Discover Feeds

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Discover feeds
        env:
          FEED_DISCOVERY_APPROVALS: ${{ vars.FEED_DISCOVERY_APPROVALS }}
          AWIN_API_KEY: ${{ secrets.AWIN_API_KEY }}
          AWIN_PUBLISHER_ID: ${{ vars.AWIN_PUBLISHER_ID || '2855063' }}
          EFFINITY_API_KEY: ${{ secrets.EFFINITY_API_KEY }}
          CJ_TOKEN: ${{ secrets.CJ_TOKEN }}
          CJ_PUBLISHER_ID: ${{ secrets.CJ_PUBLISHER_ID }}
        run: node scripts/discover-feeds.js

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feed-discovery-report
          path: feed-discovery-report.json
          retention-days: 7
          if-no-files-found: ignore
