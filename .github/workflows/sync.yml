name: Sync Products
on:
  workflow_dispatch:
  schedule:
    # Tous les jours à 4h UTC (6h Paris)
    - cron: '0 4 * * *'
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install pg
      - name: Run sync
        env:
          # Base
          NEON_URL: ${{ secrets.NEON_URL }}
          # Une comparaison réelle commence à 2 marchands distincts.
          MIN_VENDORS: '2'
          # Marge memoire pour l'index EAN (plusieurs millions d'entrees)
          NODE_OPTIONS: '--max-old-space-size=6144'
          # Reseaux d'affiliation
          AFFILAE_TOKEN: ${{ secrets.AFFILAE_TOKEN }}
          AFFILAE_FEEDS: ${{ secrets.AFFILAE_FEEDS }}
          EFFINITY_FEEDS: ${{ secrets.EFFINITY_FEEDS }}
          AWIN_API_KEY: ${{ secrets.AWIN_API_KEY }}
          AWIN_FEEDS: ${{ secrets.AWIN_FEEDS }}
          CJ_TOKEN: ${{ secrets.CJ_TOKEN }}
          CJ_PUBLISHER_ID: ${{ secrets.CJ_PUBLISHER_ID }}
          CJ_FEEDS: ${{ secrets.CJ_FEEDS }}
        run: node scripts/sync.js
      - name: Ensure query indexes
        if: success()
        env:
          NEON_URL: ${{ secrets.NEON_URL }}
        run: node scripts/optimize-database.js
      - name: Capture changed prices
        if: success()
        env:
          NEON_URL: ${{ secrets.NEON_URL }}
        run: node scripts/capture-price-history.js
      - name: Upload sync quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hifind-sync-report-${{ github.run_number }}
          path: sync-report.json
          if-no-files-found: ignore
          retention-days: 30
