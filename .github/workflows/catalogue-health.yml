name: Catalogue quality monitoring
on:
  workflow_dispatch:
  schedule:
    - cron: '15 8 * * *'
  push:
    branches: [main]
    paths:
      - scripts/catalogue-health.js
      - scripts/lib/catalogue-quality.js
      - .github/workflows/catalogue-health.yml
permissions:
  contents: read
concurrency:
  group: catalogue-health
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts
      - name: Analyse catalogue quality and freshness
        env:
          NEON_URL: ${{ secrets.NEON_URL }}
        run: node scripts/catalogue-health.js
