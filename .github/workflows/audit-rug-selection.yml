name: Audit Rug Selection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/audit-rug-selection.js', '.github/workflows/audit-rug-selection.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
      - name: Read source coverage and storage without mutations
        env:
          EFFINITY_FEEDS: ${{ secrets.EFFINITY_FEEDS }}
          NEON_URL: ${{ secrets.NEON_URL }}
        run: node scripts/audit-rug-selection.js
