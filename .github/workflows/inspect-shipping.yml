name: Inspect Shipping Columns
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run diagnostic
        env:
          EFFINITY_FEEDS: ${{ secrets.EFFINITY_FEEDS }}
          AWIN_FEEDS: ${{ secrets.AWIN_FEEDS }}
          AFFILAE_FEEDS: ${{ secrets.AFFILAE_FEEDS }}
          CJ_TOKEN: ${{ secrets.CJ_TOKEN }}
        run: node scripts/inspect-shipping-columns.js
